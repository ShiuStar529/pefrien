<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pefrien · 运营反馈</title><style>*{box-sizing:border-box}body{font:15px/1.6 system-ui;background:#fff9ec;color:#4d583d;margin:0}main{max-width:850px;margin:auto;padding:30px 20px}h1{font-size:26px}input,textarea,select,button{font:inherit;border:1px solid #d9dfc6;border-radius:12px;padding:10px;background:#fffdf5;color:inherit}input,textarea{width:100%}button{cursor:pointer;background:#e7efce;margin:8px 0}article{background:#fffef8;border:1px solid #e0e4cd;padding:20px;border-radius:20px;margin:16px 0}p{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#93947e}#login{max-width:430px}header{display:flex;justify-content:space-between;align-items:center}.status{color:#b36f3c}label{display:block;margin:12px 0}.row{display:flex;gap:12px;align-items:center}.row select{flex:1}</style></head><body><main><header><h1>Pefrien · 运营反馈</h1><button onclick="refresh()">刷新</button></header><form id="login" onsubmit="unlock(event)"><label>运营密钥<input name="key" type="password" autocomplete="off" required></label><p><small>本地密钥存放在服务目录的 .runtime/ops-key.txt，不会通过网页公开。</small></p><button>进入反馈后台</button></form><p id="status" role="status"></p><section id="items"></section></main><script>
let key='';const escapeHTML=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(method,body){const r=await fetch('/api/ops/feedback',{method,headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error);return data}
async function unlock(e){e.preventDefault();key=new FormData(e.target).get('key');await refresh()}
async function refresh(){if(!key)return;try{const r=await request('GET');document.getElementById('login').hidden=true;document.getElementById('status').textContent=`共 ${r.items.length} 条反馈`;document.getElementById('items').innerHTML=r.items.map(x=>`<article><div class="row"><strong>${escapeHTML(x.kind)}</strong><small>${new Date(x.created*1000).toLocaleString('zh-CN')}</small></div><p>${escapeHTML(x.body)}</p><small>编号：${x.id}<br>联系方式：${escapeHTML(x.contact||'未填写')} · ${x.user_id?'已登录用户':'访客'}</small><form onsubmit="save(event,'${x.id}')"><label>运营回复<textarea name="reply" rows="3" maxlength="1000">${escapeHTML(x.reply)}</textarea></label><div class="row"><select name="status">${['待处理','处理中','已解决'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select><button>保存处理结果</button></div></form></article>`).join('')||'<p>还没有收到反馈。</p>'}catch(e){document.getElementById('status').textContent=e.message}}
async function save(e,id){e.preventDefault();try{await request('PUT',{id,...Object.fromEntries(new FormData(e.target))});await refresh()}catch(err){document.getElementById('status').textContent=err.message}}
</script></body></html>
