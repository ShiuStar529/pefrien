<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pefrien · 一起走走</title><style>

t-weight:650}.ticket-line{display:flex;justify-content:space-between;align-items:end}.ticket-line strong{font:italic 58px/1 Georgia,serif}.serial{font-family:monospace;letter-spacing:3px;font-size:12px}.aster{position:absolute;right:3px;top:2px;width:62px;height:62px;display:grid;place-items:center;font-size:68px;color:#ff7841;transform:rotate(10deg)}.primary{width:100%;background:var(--ink);color:white;border-radius:18px;min-height:60px;font-weight:600;font-size:17px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 0 #d2c9d9}.primary .arr{font-size:25px;font-weight:400}.primary:active{transform:translateY(2px);box-shadow:0 2px 0 #d2c9d9}.profile-row{margin-top:22px;display:flex;align-items:center;width:100%;text-align:left;background:transparent;gap:12px;padding:0}.avatar{width:46px;height:46px;border-radius:15px;object-fit:cover}.profile-row strong{display:block;font-size:14px}.profile-row span{font-size:12px;color:var(--muted)}.profile-row .edit{margin-left:auto;color:var(--ink)}.foot{text-align:center;color:var(--muted);font-size:12px;margin:21px 0 0}.page{animation:in .22s ease-out}.subhead{display:flex;align-items:center;gap:14px;margin-bottom:23px}.back-btn{border:1px solid var(--line);border-radius:14px;width:46px;background:transparent;font-size:22px}.subhead h2{font-size:22px;margin:0}.subhead p{margin:0;color:var(--muted);font-size:12px}.form-title{font-size:24px;letter-spacing:-1px;margin:28px 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}input,select{border:1px solid var(--line);border-radius:12px;background:#fffdf9;min-height:48px;padding:10px;width:100%;color:var(--ink)}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:8px 13px;border:1px solid var(--line);background:transparent;border-radius:30px}.chip.on{background:var(--lav);border-color:#a58bbb}.chip.no.on{background:#ffddca;border-color:#ed956a}.note{color:var(--muted);font-size:12px;margin:10px 0 20px}.form-actions{margin-top:25px}.status{text-align:center;padding:55px 0 20px}.status h1{font-size:30px;letter-spacing:-1px}.status p{color:var(--muted)}.pulse{margin:30px auto;width:160px;height:180px;border-radius:20px;background:var(--orange);display:grid;place-items:center;font:italic 100px Georgia;transform:rotate(7deg);animation:pulse 1s infinite alternate}.soft{width:100%;background:var(--lav);border-radius:15px;padding:13px;font-weight:600}.navigation .nav-top{display:flex;align-items:center;justify-content:space-between}.nav-top span{font-size:12px}.nav-top b{font-size:14px}.nav-title{margin:29px 0 0;font-size:30px;line-height:1.3;letter-spacing:-1px}.direction{margin-top:24px;background:var(--lav);border-radius:24px;padding:20px 24px 22px;position:relative}.direction .huge-arrow{font-size:112px;line-height:1.2;font-family:Arial,sans-serif;text-align:center;margin:10px 0;color:#765393}.direction .direct-label{display:flex;align-items:center;justify-content:space-between;border-top:1px dashed #b6a4c7;padding-top:15px}.distance{font-size:29px;font-weight:700}.distance small{font-size:14px;font-weight:400}.route{display:flex;gap:16px;align-items:center;padding:21px 0}.route-icon{font-size:34px}.route strong{display:block;font-size:17px}.route span{font-size:12px;color:var(--muted)}.steps{display:flex;gap:7px;margin:0 0 20px}.steps i{height:5px;background:#e4dfd7;border-radius:10px;flex:1}.steps i.done{background:var(--orange)}.cancel{background:transparent;text-decoration:underline;width:100%;margin-top:14px;color:var(--muted)}.reveal-top{position:relative;padding-top:12px}.reveal-top h1{font-size:34px;letter-spacing:-1.8px;line-height:1.25}.confetti{position:absolute;right:4px;top:8px;font-size:54px;color:var(--orange)}.portrait{width:100%;height:260px;border-radius:22px;object-fit:cover;object-position:center 40%;display:block}.reveal-card{padding:19px 20px;background:var(--lav);border-radius:20px;margin:-25px 12px 23px;position:relative;transform:rotate(-2deg);border:1px solid #cbb9dc;box-shadow:0 4px 0 #ded4e8}.reveal-card h2{font-size:28px;margin:3px 0 8px}.facts{display:flex;flex-wrap:wrap;gap:7px;font-size:12px}.facts span{background:#f4effb;border-radius:20px;padding:4px 9px}.empty{padding:35px 10px 20px;text-align:center}.empty h1{font-size:28px}.empty p{color:var(--muted);line-height:1.8}.empty-symbol{font:italic 90px Georgia;color:#a58bbb}.notice{margin-bottom:16px;padding:12px;border-radius:12px;background:#ffeadc;font-size:14px}.hidden{display:none!important}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes pulse{from{transform:rotate(7deg) scale(.96)}to{transform:rotate(3deg) scale(1.04)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:350px){main{padding:20px}.hero h1{font-size:38px}.tickets{height:246px}.ticket-title{font-size:25px}.top{margin-bottom:23px}}button:disabled{opacity:.6;cursor:wait}

/* Direction B refinement: a folded, warm compass pointer and consistent line icons. */
.icon{width:22px;height:22px;display:inline-block;vertical-align:middle;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.primary .arr{display:flex;align-items:center}.profile-row .edit{display:flex;gap:5px;align-items:center}.profile-row .edit .icon{width:17px;height:17px}
.direction{background:#eee7f6;padding:20px 22px 18px;border:1px solid #e5daee;border-radius:28px}.direction .eyebrow{font-size:12px;letter-spacing:.4px;color:#64556e;text-align:center;font-weight:500}
.bearing-dial{width:224px;height:224px;position:relative;margin:12px auto 4px;display:grid;place-items:center;isolation:isolate}


.bearing-orbit{position:absolute;inset:0;transform:rotate(var(--bearing,38deg));transition:transform .85s cubic-bezier(.22,1,.36,1)}

.bearing-pointer{position:absolute;width:82px;height:100px;left:calc(50% - 41px);top:calc(50% - 50px);filter:drop-shadow(0 7px 7px #a9653c24)}

.bearing-caption{font-size:12px;text-align:center;color:#786780;margin:0 0 15px}.direction .direct-label{border-top:1px solid #d8cbe3;padding-top:14px;font-size:13px;color:#66596e}.distance{color:var(--ink);font-size:30px;letter-spacing:-.5px}.distance small{color:#796c80;font-size:13px}
.route-icon{height:46px;width:46px;border-radius:15px;background:#f9e9dc;display:grid;place-items:center;color:#aa572e;flex-shrink:0}.route-icon .icon{width:26px;height:26px;stroke-width:1.8}.route{gap:13px;padding:20px 0}.route span{display:block;line-height:1.6;margin-top:3px}.nav-title{margin-top:24px}.navigation .foot{margin-top:16px}.navigation .cancel{margin-top:8px}.match-pointer{width:74px;height:90px;transform:rotate(38deg);filter:drop-shadow(0 5px 5px #9b3f2520)}
.meet-popup{background:var(--paper);color:var(--ink)}.meet-popup::backdrop{background:#30233c77}.meet-popup button{background:var(--ink)}

</style><link rel="stylesheet" href="accounts.css"></head><body><main id="app"></main><script>
const sampleGoldenPhoto='assets/golden-sample.webp';
let step=0,timer=null;
const breeds=['金毛','柯基','柴犬','比熊','拉布拉多','边牧'];
const defaultAvatar="data:image/svg+xml;charset=utf-8,"+encodeURIComponent("<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 96 96\"><rect width=\"96\" height=\"96\" rx=\"31\" fill=\"#f7dfaf\"/><g fill=\"#89836b\" transform=\"translate(23 23) scale(1.56) rotate(-13 16 16)\"><ellipse cx=\"8\" cy=\"11\" rx=\"3.2\" ry=\"4.2\" transform=\"rotate(-25 8 11)\"/><ellipse cx=\"14\" cy=\"7\" rx=\"3\" ry=\"4\"/><ellipse cx=\"21\" cy=\"8\" rx=\"3\" ry=\"4\" transform=\"rotate(15 21 8)\"/><ellipse cx=\"26\" cy=\"14\" rx=\"2.8\" ry=\"3.7\" transform=\"rotate(35 26 14)\"/><path d=\"M9 21c2-5 4-7 7-7s5 3 8 7c3 5-1 8-5 6-3-1-4-1-7 0-5 2-7-2-3-6Z\"/></g></svg>");
const pool=breeds.map((breed,i)=>({name:['栗子','年糕','团团','棉花','可可','奥利'][i],breed,age:[3,2,4,2,3,2][i],weight:[26,12,10,5,28,18][i],sex:i%2?'女孩子':'男孩子',image:i===0?sampleGoldenPhoto:''}));let partner=pool[0];
const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const lineIcon=(kind='forward')=>{const paths={forward:'M5 12h14m-6-6 6 6-6 6',diagonal:'M6 18 18 6M6 6h12v12',back:'M19 12H5m6-6-6 6 6 6',straight:'M12 20V4m-6 6 6-6 6 6',right:'M6 21V11a3 3 0 0 1 3-3h11m-6-6 6 6-6 6'};return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[kind]||paths.forward}"/></svg>`};
const pointerGraphic=(cls='bearing-pointer')=>`<svg class="${cls}" viewBox="0 0 100 120" aria-hidden="true"><path d="M46.5 11.5Q50 3 53.5 11.5L86 99Q88 105 82 102L50 86L18 102Q12 105 14 99Z" fill="#ef794b"/><path d="M50 7Q52 7 53.5 11.5L86 99Q88 105 82 102L50 86Z" fill="#ffc59b"/><path d="M47 12Q50 5 53 12" fill="none" stroke="#fff3df" stroke-width="1.5" stroke-linecap="round"/></svg>`;

const paw=()=>`<svg class="paw-icon" viewBox="0 0 32 32" aria-hidden="true"><ellipse cx="8" cy="11" rx="3.2" ry="4.2" transform="rotate(-25 8 11)"/><ellipse cx="14" cy="7" rx="3" ry="4"/><ellipse cx="21" cy="8" rx="3" ry="4" transform="rotate(15 21 8)"/><ellipse cx="26" cy="14" rx="2.8" ry="3.7" transform="rotate(35 26 14)"/><path d="M9 21c2-5 4-7 7-7s5 3 8 7c3 5-1 8-5 6-3-1-4-1-7 0-5 2-7-2-3-6Z"/></svg>`;
const brand=()=>`<div class="brand"><span class="brand-paw">${paw()}</span>Pefrien<span class="brand-dot">.</span></div>`;
const puppyArt=(cls='puppy-art')=>`<img class="${cls}" src="assets/puppies.webp" width="960" height="640" decoding="async" alt="两只小狗好奇地碰鼻子，Pefrien 品牌插画">`;
function show(markup){app.innerHTML='<div class="page">'+markup+'</div>';window.scrollTo(0,0)}
function home(){clearTimeout(timer);show(`<header class="top">${brand()}<span class="badge nearby">${paw()} 附近 3 km</span></header><section class="hero"><span class="day-label">今日宜 · 出门撒欢</span><h1>走呀，<br>去交个<em>狗朋友！</em></h1><p>让小鼻子碰个面，让散步多点惊喜。</p></section><div class="puppy-scene"><span class="say hello">一起玩？</span><span class="say woof">汪！</span>${puppyArt()}<span class="scene-note">下一位狗朋友，见面才揭晓</span></div><button class="primary" onclick="match()"><span class="button-label">${paw()} 出发，找狗朋友</span><span class="arr">${lineIcon()}</span></button><p class="under-button">牵好小绳子，带上好奇心。</p>${familySummary()}<p class="foot home-foot">模拟体验 · 无需定位 · 匹配范围 3 km</p>`)}
function match(){if(!matchGate())return;show(`<header class="top">${brand()}<span class="badge">模拟匹配</span></header><section class="status" role="status"><div class="match-art">${puppyArt()}<span class="sniff">嗅嗅…</span></div><div class="paw-loader" aria-hidden="true">${paw()}${paw()}${paw()}</div><h1>谁也想出来玩？</h1><p>正在附近寻找合适的小伙伴…</p></section><button class="cancel" onclick="home()">先等等，取消匹配</button>`);timer=setTimeout(()=>{let matches=pool.filter(compatibleDogs);if(!matches.length){empty();return}partner=matches[0];show(`<header class="top">${brand()}<span class="badge">模拟匹配成功</span></header><section class="status" role="status"><div class="match-art">${puppyArt()}<span class="sniff found">尾巴摇起来啦</span></div><h1>有只小可爱，<br>也想和你一起玩！</h1><p>相距约 680 米。<br>先不告诉你是谁，见面再认识。</p></section><button class="primary" onclick="step=0;nav()"><span class="button-label">${paw()} 走，去碰个面</span><span class="arr">${lineIcon()}</span></button><p class="foot">模拟伙伴与路线 · 不提供真实导航</p><button class="cancel" onclick="home()">这次先不出门</button>`);},1300)}
function empty(){show(`<header class="subhead"><button class="back-btn" aria-label="返回" onclick="home()">${lineIcon('back')}</button><h2>再换个散步机会</h2></header><section class="empty"><div class="empty-symbol">…</div><h1>暂时没有合适的伙伴</h1><p>当前偏好与排除条件下，<br>没有可匹配的示例狗狗。<br>试着调整偏好，再出发吧。</p></section><button class="primary" onclick="edit()">调整散步偏好 <span class="arr">${lineIcon('diagonal')}</span></button><button class="cancel" onclick="home()">返回首页</button>`)}
const legs=[{dist:680,bearing:38,label:'右前方',road:'直行 120 米',detail:'下个路口右转，沿人行道继续',turn:'straight'},{dist:420,bearing:74,label:'右侧',road:'路口右转，走 180 米',detail:'道路转向与伙伴方位分别显示',turn:'right'},{dist:180,bearing:28,label:'右前方',road:'直行 100 米',detail:'继续沿人行道走，伙伴就在前方',turn:'straight'},{dist:30,bearing:0,label:'正前方',road:'向前走 30 米',detail:'就快见面了，留意身边的狗友',turn:'straight'}];
function nav(){const l=legs[step];if(document.getElementById('bearing-orbit')){document.getElementById('bearing-orbit').style.setProperty('--bearing',l.bearing+'deg');document.getElementById('bearing-dial').setAttribute('aria-label','伙伴位于'+l.label+'，直线相对方位');document.getElementById('distance-value').textContent=l.dist;document.getElementById('road-icon').innerHTML=lineIcon(l.turn);document.getElementById('road-title').textContent=l.road;document.getElementById('road-detail').textContent='道路提示 · '+l.detail;document.getElementById('advance-label').textContent=step===3?'再走几步，打个招呼':'模拟走一段';document.getElementById('route-progress').setAttribute('aria-label',`第 ${step+1} 段，共 4 段`);document.querySelectorAll('.steps i').forEach((e,i)=>e.classList.toggle('done',i<=step));return;}
show(`<section class="navigation"><header class="nav-top"><b>小狗朋友，正在靠近</b><span class="badge">模拟导航</span></header><div class="direction"><div class="eyebrow">有条小尾巴，在这个方向</div><div class="bearing-dial" id="bearing-dial" role="group" aria-label="伙伴位于${l.label}，直线相对方位"><div class="bearing-orbit" id="bearing-orbit" style="--bearing:${l.bearing}deg">${noseButton()}</div></div><h1 class="nav-title">小鼻子闻闻，<br>朋友在那边。</h1><p class="bearing-caption">鼻尖朝向对方 · 道路请看下方提示</p>${noseSwitcher()}</div><div class="walk-details"><div class="direct-label"><span>与伙伴直线相距</span><span class="distance"><span id="distance-value">${l.dist}</span> <small>米</small></span></div><div class="route"><div class="route-icon" id="road-icon" aria-hidden="true">${lineIcon(l.turn)}</div><div><strong id="road-title">${l.road}</strong><span id="road-detail">道路提示 · ${l.detail}</span></div></div></div><div class="steps" id="route-progress" aria-label="第 ${step+1} 段，共 4 段">${legs.map((_,i)=>`<i class="${i<=step?'done':''}"></i>`).join('')}</div><button class="primary" onclick="advance()"><span id="advance-label">${step===3?'再走几步，打个招呼':'模拟走一段'}</span><span class="arr">${lineIcon()}</span></button><p class="foot">资料保持神秘 · 所有方位、距离均为示例</p><button class="cancel" onclick="home()">今天先走到这里</button></section>`)}
function advance(){if(step<3){step++;nav()}else reveal()}

function normalizeBreed(s){return String(s||'').toLowerCase().replace(/[\s\-_/·]/g,'')}
function breedResults(query){const q=normalizeBreed(query);if(!q)return petBreeds;const subseq=(s)=>{let i=0;for(const c of s)if(c===q[i])i++;return i===q.length};return petBreeds.map(b=>{const n=normalizeBreed(b),a=normalizeBreed(breedAliases[b]);return {b,rank:n===q?0:n.includes(q)?1:a.includes(q)?2:subseq(n)||subseq(a)?3:99}}).filter(x=>x.rank<99).sort((a,b)=>a.rank-b.rank).map(x=>x.b)}

  if(el)el.textContent=storageFailed?'保存失败，请先不要关闭页面。可以稍后重试。':photoJobs.has(editingId)?'照片处理中，其他资料已自动保存…':'已自动保存到当前浏览器';
}
function saveVisiblePet(){const form=document.getElementById('pet-form');if(form)capturePet(form);else persist()}
function updatePhotoControls(id,message=''){
  if(currentPet()?.id!==id)return;
  const p=currentPet(),status=document.getElementById('photo-status'),avatar=document.getElementById('profile-photo'),remove=document.getElementById('remove-photo'),preview=document.getElementById('preview-photo');
  if(avatar){avatar.src=petPhoto(p);avatar.alt=petPhotoAlt(p)}
  if(remove)remove.hidden=!hasPetPhoto(p);
  if(status)status.textContent=message;
  if(preview){preview.disabled=photoJobs.has(id);preview.textContent=preview.disabled?'照片处理中…':'预览相遇弹窗 ↗'}
  refreshSaveStatus();
}
function photoEditor(p){return `<section class="photo-editor"><img id="profile-photo" class="pet-avatar" src="${petPhoto(p)}" alt="${esc(petPhotoAlt(p))}"><div><label class="photo-upload">＋ 添加 / 更换照片<input type="file" accept="image/*" onchange="uploadPetPhoto(this)"></label><p>选填 · 相遇后才揭晓的小可爱</p><button type="button" id="preview-photo" class="text-action" onclick="previewMeeting()" ${photoJobs.has(p.id)?'disabled':''}>${photoJobs.has(p.id)?'照片处理中…':'预览相遇弹窗 ↗'}</button><button type="button" id="remove-photo" class="text-action" onclick="removePhoto()" ${hasPetPhoto(p)?'':'hidden'}>恢复默认头像</button></div><p id="photo-status" role="status">${photoJobs.has(p.id)?'正在整理照片，完成后会自动保存。':''}</p></section>`}
function uploadPetPhoto(input){
  const file=input.files?.[0],p=currentPet();if(!file||!p)return Promise.resolve();
  saveVisiblePet();
  if(!file.type.startsWith('image/')){updatePhotoControls(p.id,'请选择一张图片。');return Promise.resolve()}
  if(file.size>20*1024*1024){updatePhotoControls(p.id,'图片有点大，请选择 20 MB 以内的照片。');return Promise.resolve()}
  const version=(photoVersions.get(p.id)||0)+1;photoVersions.set(p.id,version);
  // Each dog owns its job; a later upload for another dog cannot cancel this one.
  const job=(async()=>{
    let url;
    try{
      url=URL.createObjectURL(file);const img=new Image();img.src=url;await img.decode();
      const scale=Math.min(1,640/Math.max(img.naturalWidth,img.naturalHeight));
      const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
      const ctx=canvas.getContext('2d');ctx.fillStyle='#fffaf0';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
      if(photoVersions.get(p.id)!==version)return;
      p.image=canvas.toDataURL('image/jpeg',.78);
      // Keep the image in memory even on a failed write, so preview never reverts it silently.
      const ok=persist();
      updatePhotoControls(p.id,ok?'照片已自动保存 ✓':'照片暂未保存：浏览器空间不足或禁止存储。请先不要关闭页面，换一张较小的照片重试。');
    }catch(e){if(photoVersions.get(p.id)===version)updatePhotoControls(p.id,'这张照片暂时无法读取，试试 JPG、PNG 或 WebP。')}
    finally{
      if(url)URL.revokeObjectURL(url);input.value='';
      if(photoVersions.get(p.id)===version){photoJobs.delete(p.id);updatePhotoControls(p.id,document.getElementById('photo-status')?.textContent||'')}
    }
  })();
  photoJobs.set(p.id,job);updatePhotoControls(p.id,'正在整理照片，完成后会自动保存。');return job;
}
function removePhoto(){
  const p=currentPet();if(!p)return;saveVisiblePet();
  photoVersions.set(p.id,(photoVersions.get(p.id)||0)+1);photoJobs.delete(p.id);
  delete p.image;persist();updatePhotoControls(p.id,storageFailed?'头像更改尚未保存，请不要关闭页面。':'已恢复爪爪头像，并自动保存 ✓');
}
async function previewMeeting(){
  const p=currentPet();if(!p)return;saveVisiblePet();
  // Defensive await also covers a click queued before the disabled state was painted.
  while(photoJobs.has(p.id))await photoJobs.get(p.id);
  if(currentPet()?.id!==p.id||!document.getElementById('preview-photo'))return;
  setMeetingPhoto(p);const modal=document.getElementById('meet-popup');
  modal.querySelector('button').textContent='返回填写资料 ↩';modal.showModal();
}
function savePreferenceSearch(group){const p=currentPet();if(!p)return;p.searchDraft={...p.searchDraft,[group]:document.getElementById('search-'+group).value};persist();renderPreferences(group)}
