let profile={name:'豆包',breed:'金毛',age:'2',weight:'24',sex:'男孩子'},want=['金毛','柯基'],avoid=[],draftWant=[],draftAvoid=[],step=0,timer=null;
const breeds=['金毛','柯基','柴犬','比熊','拉布拉多','边牧'];
const pool=breeds.map((breed,i)=>({name:['栗子','年糕','团团','棉花','可可','奥利'][i],breed,age:[3,2,4,2,3,2][i],weight:[26,12,10,5,28,18][i],sex:i%2?'女孩子':'男孩子'}));let partner=pool[0];
const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const lineIcon=(kind='forward')=>{const paths={forward:'M5 12h14m-6-6 6 6-6 6',diagonal:'M6 18 18 6M6 6h12v12',back:'M19 12H5m6-6-6 6 6 6',straight:'M12 20V4m-6 6 6-6 6 6',right:'M6 21V11a3 3 0 0 1 3-3h11m-6-6 6 6-6 6'};return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[kind]||paths.forward}"/></svg>`};
const pointerGraphic=(cls='bearing-pointer')=>`<svg class="${cls}" viewBox="0 0 100 120" aria-hidden="true"><path d="M46.5 11.5Q50 3 53.5 11.5L86 99Q88 105 82 102L50 86L18 102Q12 105 14 99Z" fill="#ef794b"/><path d="M50 7Q52 7 53.5 11.5L86 99Q88 105 82 102L50 86Z" fill="#ffc59b"/><path d="M47 12Q50 5 53 12" fill="none" stroke="#fff3df" stroke-width="1.5" stroke-linecap="round"/></svg>`;

const paw=()=>`<svg class="paw-icon" viewBox="0 0 32 32" aria-hidden="true"><ellipse cx="8" cy="11" rx="3.2" ry="4.2" transform="rotate(-25 8 11)"/><ellipse cx="14" cy="7" rx="3" ry="4"/><ellipse cx="21" cy="8" rx="3" ry="4" transform="rotate(15 21 8)"/><ellipse cx="26" cy="14" rx="2.8" ry="3.7" transform="rotate(35 26 14)"/><path d="M9 21c2-5 4-7 7-7s5 3 8 7c3 5-1 8-5 6-3-1-4-1-7 0-5 2-7-2-3-6Z"/></svg>`;
const brand=()=>`<div class="brand"><span class="brand-paw">${paw()}</span>Pefrien<span class="brand-dot">.</span></div>`;
const puppyArt=(cls='puppy-art')=>`<img class="${cls}" src="assets/puppies.png" alt="两只小狗好奇地碰鼻子，Pefrien 品牌插画">`;
function show(markup){app.innerHTML='<div class="page">'+markup+'</div>';window.scrollTo(0,0)}
function home(){clearTimeout(timer);show(`<header class="top">${brand()}<span class="badge nearby">${paw()} 附近 3 km</span></header><section class="hero"><span class="day-label">今日宜 · 出门撒欢</span><h1>走呀，<br>去交个<em>狗朋友！</em></h1><p>让小鼻子碰个面，让散步多点惊喜。</p></section><div class="puppy-scene"><span class="say hello">一起玩？</span><span class="say woof">汪！</span>${puppyArt()}<span class="scene-note">下一位狗朋友，见面才揭晓</span></div><button class="primary" onclick="match()"><span class="button-label">${paw()} 出发，找狗朋友</span><span class="arr">${lineIcon()}</span></button><p class="under-button">牵好小绳子，带上好奇心。</p><button class="profile-row" onclick="edit()"><img class="avatar" src="${photo}" alt="模拟狗狗档案照片"><div><strong>${esc(profile.name)}的小档案</strong><span>${esc(profile.breed)} · ${esc(profile.age)} 岁 · 设置交友偏好</span></div><span class="edit">${lineIcon('diagonal')}</span></button><p class="foot home-foot">模拟体验 · 无需定位 · 匹配范围 3 km</p>`)}
function edit(){draftWant=[...want];draftAvoid=[...avoid];show(`<header class="subhead"><button class="back-btn" aria-label="返回首页" onclick="home()">${lineIcon('back')}</button><div><h2>我家小可爱</h2><p>让新朋友多了解它一点点</p></div></header><form onsubmit="save(event)"><div class="profile-greeting"><span class="mini-paw">${paw()}</span><span>每只小狗，都有自己的可爱。</span></div><h3 class="form-title">它的小档案</h3><div class="grid"><label class="field full">狗狗名字<input name="name" value="${esc(profile.name)}" required maxlength="12"></label><label class="field full">品种<select name="breed">${breeds.map(x=>`<option ${x===profile.breed?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">年龄（岁）<input name="age" type="number" min="0.1" max="30" step="0.1" required value="${esc(profile.age)}"></label><label class="field">体重（kg）<input name="weight" type="number" min="0.1" max="100" step="0.1" required value="${esc(profile.weight)}"></label><label class="field full">性别<select name="sex"><option ${profile.sex==='男孩子'?'selected':''}>男孩子</option><option ${profile.sex==='女孩子'?'selected':''}>女孩子</option></select></label></div><h3 class="form-title">想遇见谁？</h3><p class="note">可多选；不选则向所有品种开放。</p><div class="chips" id="want"></div><h3 class="form-title">绝不想遇见</h3><p class="note">这些品种会被排除，优先于喜欢的品种。</p><div class="chips" id="avoid"></div><p class="note">同一品种只会出现在一组里。档案为本次体验保存。</p><div class="form-actions"><button class="primary" type="submit">保存，准备出门 <span class="arr">✓</span></button></div></form>`);chips()}
function chips(){['want','avoid'].forEach(group=>{document.getElementById(group).innerHTML=breeds.map(b=>`<button type="button" class="chip ${group==='avoid'?'no':''} ${(group==='want'?draftWant:draftAvoid).includes(b)?'on':''}" aria-pressed="${(group==='want'?draftWant:draftAvoid).includes(b)}" onclick="toggle('${group}','${b}')">${b}</button>`).join('')})}
function toggle(group,b){let a=group==='want'?draftWant:draftAvoid;if(a.includes(b)){a.splice(a.indexOf(b),1)}else{a.push(b);let other=group==='want'?draftAvoid:draftWant;let i=other.indexOf(b);if(i>=0)other.splice(i,1)}chips()}
function save(e){e.preventDefault();const f=new FormData(e.target);if(!f.get('name').trim()){e.target.elements.name.setCustomValidity('请填写狗狗名字');e.target.elements.name.reportValidity();e.target.elements.name.oninput=()=>e.target.elements.name.setCustomValidity('');return}profile=Object.fromEntries(f);profile.name=profile.name.trim();want=[...draftWant];avoid=[...draftAvoid];home()}
function match(){show(`<header class="top">${brand()}<span class="badge">模拟匹配</span></header><section class="status" role="status"><div class="match-art">${puppyArt()}<span class="sniff">嗅嗅…</span></div><div class="paw-loader" aria-hidden="true">${paw()}${paw()}${paw()}</div><h1>谁也想出来玩？</h1><p>正在附近寻找合适的小伙伴…</p></section><button class="cancel" onclick="home()">先等等，取消匹配</button>`);timer=setTimeout(()=>{let matches=pool.filter(x=>!avoid.includes(x.breed)&&(!want.length||want.includes(x.breed)));if(!matches.length){empty();return}partner=matches[0];show(`<header class="top">${brand()}<span class="badge">模拟匹配成功</span></header><section class="status" role="status"><div class="match-art">${puppyArt()}<span class="sniff found">尾巴摇起来啦</span></div><h1>有只小可爱，<br>也想和你一起玩！</h1><p>相距约 680 米。<br>先不告诉你是谁，见面再认识。</p></section><button class="primary" onclick="step=0;nav()"><span class="button-label">${paw()} 走，去碰个面</span><span class="arr">${lineIcon()}</span></button><p class="foot">模拟伙伴与路线 · 不提供真实导航</p><button class="cancel" onclick="home()">这次先不出门</button>`);},1300)}
function empty(){show(`<header class="subhead"><button class="back-btn" aria-label="返回" onclick="home()">${lineIcon('back')}</button><h2>再换个散步机会</h2></header><section class="empty"><div class="empty-symbol">…</div><h1>暂时没有合适的伙伴</h1><p>当前偏好与排除条件下，<br>没有可匹配的示例狗狗。<br>试着调整偏好，再出发吧。</p></section><button class="primary" onclick="edit()">调整散步偏好 <span class="arr">${lineIcon('diagonal')}</span></button><button class="cancel" onclick="home()">返回首页</button>`)}
const legs=[{dist:680,bearing:38,label:'右前方',road:'直行 120 米',detail:'下个路口右转，沿人行道继续',turn:'straight'},{dist:420,bearing:74,label:'右侧',road:'路口右转，走 180 米',detail:'道路转向与伙伴方位分别显示',turn:'right'},{dist:180,bearing:28,label:'右前方',road:'直行 100 米',detail:'继续沿人行道走，伙伴就在前方',turn:'straight'},{dist:30,bearing:0,label:'正前方',road:'向前走 30 米',detail:'就快见面了，留意身边的狗友',turn:'straight'}];
function nav(){const l=legs[step];if(document.getElementById('bearing-orbit')){document.getElementById('bearing-orbit').style.setProperty('--bearing',l.bearing+'deg');document.getElementById('bearing-dial').setAttribute('aria-label','伙伴位于'+l.label+'，直线相对方位');document.getElementById('distance-value').textContent=l.dist;document.getElementById('road-icon').innerHTML=lineIcon(l.turn);document.getElementById('road-title').textContent=l.road;document.getElementById('road-detail').textContent='道路提示 · '+l.detail;document.getElementById('advance-label').textContent=step===3?'再走几步，打个招呼':'模拟走一段';document.getElementById('route-progress').setAttribute('aria-label',`第 ${step+1} 段，共 4 段`);document.querySelectorAll('.steps i').forEach((e,i)=>e.classList.toggle('done',i<=step));return;}
